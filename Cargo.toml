[package]
name = "overlay-manager"
version = "0.2.0"
edition = "2024"
description = "TUI overlay manager for Gentoo Linux"
repository = "https://github.com/Darllowin/Overlay-manager"
homepage = "https://github.com/Darllowin/Overlay-manager"
authors = ["Darllowin"]
license = "MIT"
keywords = ["gentoo", "portage", "overlay", "tui"]

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# HTTP + API
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Parsing
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow = "1"
dirs = "6"
